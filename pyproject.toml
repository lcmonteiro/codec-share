# =======================================================================================
# codec-share python package (wasm/codec_share): the wasm binding with the committed
# codec-share.wasm, and the share files (split, join, edit) with the codec-share command
#
# released as a wheel on the GitHub release of each v<version> tag (see .github/workflows)
# =======================================================================================
[project]
name = "codec-share"
version = "0.1.0"
description = "codec-share erasure codec, as WebAssembly with a python binding."
readme = "readme.md"
requires-python = ">=3.9"
license = { file = "license" }
authors = [
    { name = "Luis Monteiro", email = "monteiro.lcm@gmail.com" },
]
dependencies = [
    "wasmtime>=20",
]

[project.scripts]
codec-share = "codec_share.shares:main"

[project.urls]
Repository = "https://github.com/lcmonteiro/codec-share"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wasm/codec_share"]

[tool.hatch.build.targets.sdist]
only-include = ["pyproject.toml", "readme.md", "license", "wasm", "include"]
